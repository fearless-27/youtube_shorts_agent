<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicons & App Icons (NEMO N Emblem) -->
  <link rel="icon" type="image/svg+xml" href="images/pc_logo.svg?v=nemo_n_2026">
  <link rel="shortcut icon" href="favicon.ico?v=nemo_n_2026">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=nemo_n_2026">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png?v=nemo_n_2026">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png?v=nemo_n_2026">
  <link rel="icon" type="image/png" href="images/fav.png?v=nemo_n_2026">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png?v=nemo_n_2026">
  <script>
    try {
      const fi = document.createElement('link');
      fi.rel = 'icon';
      fi.type = 'image/png';
      fi.href = 'images/favicon-32x32.png?t=' + Date.now();
      document.head.appendChild(fi);
    } catch(e){}
  </script>

  <!-- Google Fonts: Inter & DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js for dot matrix background shader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/dashboard-link.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Container */
    .login-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* WebGL Canvas */
    #shader-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Vignette gradient */
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.95) 100%);
      pointer-events: none;
    }

    /* Top Home Link */
    .back-nav {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #888;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .back-nav:hover {
      color: #fff;
    }


    /* Card */
    .auth-card {
      position: relative;
      z-index: 2;
      background: #121212;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(16px);
      animation: cardFadeIn 0.5s ease-out;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-content {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-logo {
      background: #111;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.85rem;
      border: 1px solid #333;
      padding: 10px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
    }
    .brand-logo img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      letter-spacing: -0.025em;
      color: #fff;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 1.1rem;
      line-height: 1.4;
    }

    /* Forms */
    .auth-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .form-input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: #080808;
      color: #fff;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .form-input:focus {
      border-color: #666;
      background: #0d0d0d;
    }
    .form-input::placeholder {
      color: #555;
    }

    .btn-submit {
      width: 100%;
      padding: 0.68rem;
      border-radius: 6px;
      border: none;
      background: #ededed;
      color: #000;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-submit:hover {
      background: #fff;
    }
    .btn-submit:active {
      transform: scale(0.99);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .divider {
      height: 1px;
      background: #222;
      width: 100%;
      margin: 1rem 0;
      position: relative;
    }
    .divider::after {
      content: "OR";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #121212;
      padding: 0 8px;
      font-size: 0.7rem;
      color: #666;
      font-weight: 500;
    }

    /* Social Buttons */
    .social-btn {
      width: 100%;
      padding: 0.65rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: transparent;
      color: #fff;
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin-bottom: 0.45rem;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }
    .social-btn:hover {
      background: #181818;
      border-color: #444;
    }
    .social-btn:active {
      transform: scale(0.99);
    }
    .social-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .switch-view {
      margin-top: 1.15rem;
      font-size: 0.875rem;
      color: #888;
    }
    .switch-btn {
      color: #fff;
      font-weight: 500;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .switch-btn:hover {
      color: #ccc;
    }

    .footer-terms {
      margin-top: 0.95rem;
      font-size: 0.75rem;
      color: #666;
      line-height: 1.5;
      text-align: center;
    }
    .footer-terms a {
      color: #888;
      text-decoration: none;
    }
    .footer-terms a:hover {
      text-decoration: underline;
    }

    /* Alert / Notification banner */
    .status-banner {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.4;
      margin-bottom: 0.85rem;
      display: none;
      text-align: left;
      border: 1px solid transparent;
      animation: fadeIn 0.2s ease;
    }
    .status-banner.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .status-banner.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.4);
      color: #86efac;
    }
    .status-banner.info {
      display: block;
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }

    /* Setup Helper Modal / Guide */
    .setup-guide-pill {
      margin-top: 10px;
      font-size: 0.72rem;
      color: #ff9800;
      background: rgba(255, 152, 0, 0.12);
      border: 1px dashed rgba(255, 152, 0, 0.35);
      padding: 6px 10px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .setup-guide-pill:hover {
      background: rgba(255, 152, 0, 0.2);
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    .spinner-dark {
      border-color: rgba(0,0,0,0.2);
      border-top-color: #000;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

  <!-- Three.js Dot Matrix Shader Engine -->
  <script>
    (function () {
      const canvas = document.getElementById('shader-canvas');
      if (!canvas || !window.THREE) return;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const uniforms = {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth * 2, window.innerHeight * 2) },
        u_opacities: { value: [0.3, 0.3, 0.3, 0.5, 0.5, 0.5, 0.8, 0.8, 0.8, 1.0] },
        u_colors: {
          value: [
            new THREE.Vector3(1, 1, 1),
            new THREE.Vector3(1, 1, 1),
            new THREE.Vector3(1, 1, 1),
            new THREE.Vector3(1, 1, 1),
            new THREE.Vector3(1, 1, 1),
            new THREE.Vector3(1, 1, 1)
          ]
        },
        u_total_size: { value: 20.0 },
        u_dot_size: { value: 6.0 },
        u_reverse: { value: 0 }
      };

      const material = new THREE.ShaderMaterial({
        vertexShader: `
          precision mediump float;
          uniform vec2 u_resolution;
          out vec2 fragCoord;
          void main() {
            gl_Position = vec4(position, 1.0);
            fragCoord = (position.xy + 1.0) * 0.5 * u_resolution;
            fragCoord.y = u_resolution.y - fragCoord.y;
          }
        `,
        fragmentShader: `
          precision mediump float;
          in vec2 fragCoord;

          uniform float u_time;
          uniform float u_opacities[10];
          uniform vec3 u_colors[6];
          uniform float u_total_size;
          uniform float u_dot_size;
          uniform vec2 u_resolution;
          uniform int u_reverse;

          out vec4 fragColor;

          float PHI = 1.61803398874989484820459;
          float random(vec2 xy) {
              return fract(tan(distance(xy * PHI, xy) * 0.5) * xy.x);
          }

          void main() {
              vec2 st = fragCoord.xy;
              st.x -= abs(floor((mod(u_resolution.x, u_total_size) - u_dot_size) * 0.5));
              st.y -= abs(floor((mod(u_resolution.y, u_total_size) - u_dot_size) * 0.5));

              float opacity = step(0.0, st.x) * step(0.0, st.y);

              vec2 st2 = vec2(int(st.x / u_total_size), int(st.y / u_total_size));

              float frequency = 5.0;
              float show_offset = random(st2);
              float rand = random(st2 * floor((u_time / frequency) + show_offset + frequency));
              opacity *= u_opacities[int(rand * 10.0)];
              opacity *= 1.0 - step(u_dot_size / u_total_size, fract(st.x / u_total_size));
              opacity *= 1.0 - step(u_dot_size / u_total_size, fract(st.y / u_total_size));

              vec3 color = u_colors[int(show_offset * 6.0)];

              float animation_speed_factor = 3.0;
              vec2 center_grid = u_resolution / 2.0 / u_total_size;
              float dist_from_center = distance(center_grid, st2);

              float timing_offset_intro = dist_from_center * 0.01 + (random(st2) * 0.15);

              float current_timing_offset = timing_offset_intro;
              opacity *= step(current_timing_offset, u_time * animation_speed_factor);
              opacity *= clamp((1.0 - step(current_timing_offset + 0.1, u_time * animation_speed_factor)) * 1.25, 1.0, 1.25);

              fragColor = vec4(color, opacity);
              fragColor.rgb *= fragColor.a;
          }
        `,
        uniforms: uniforms,
        glslVersion: THREE.GLSL3,
        blending: THREE.CustomBlending,
        blendSrc: THREE.SrcAlphaFactor,
        blendDst: THREE.OneFactor,
        transparent: true
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      const startTime = performance.now();
      let animationId;

      function animate() {
        animationId = requestAnimationFrame(animate);
        uniforms.u_time.value = (performance.now() - startTime) / 1000.0;
        renderer.render(scene, camera);
      }
      animate();

      function handleResize() {
        const dpr = Math.min(window.devicePixelRatio, 2);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(dpr);
        uniforms.u_resolution.value.set(window.innerWidth * dpr, window.innerHeight * dpr);
      }
      window.addEventListener('resize', handleResize);
    })();
  </script>

  <!-- Auth Controller & Firebase Binding -->
  <script type="module">
    import {
      signInWithGoogle,
      signInWithGithub,
      signInWithApple,
      signInWithEmail,
      signUpWithEmail,
      isFirebaseConfigured,
      getCachedUser,
      checkRedirectAuth
    } from "./js/firebase-auth.js";

    let isLoginMode = true;

    const titleText = document.getElementById("title-text");
    const subtitleText = document.getElementById("subtitle-text");
    const nameInput = document.getElementById("name-input");
    const emailInput = document.getElementById("email-input");
    const passwordInput = document.getElementById("password-input");
    const submitBtn = document.getElementById("submit-btn");
    const submitBtnText = document.getElementById("submit-btn-text");
    const toggleViewBtn = document.getElementById("toggle-view-btn");
    const switchPrompt = document.getElementById("switch-prompt");
    const statusBanner = document.getElementById("status-banner");

    const btnGoogle = document.getElementById("btn-google");
    const btnGithub = document.getElementById("btn-github");
    const btnApple = document.getElementById("btn-apple");
    const googleBtnText = document.getElementById("google-btn-text");
    const githubBtnText = document.getElementById("github-btn-text");
    const appleBtnText = document.getElementById("apple-btn-text");

    function showStatus(message, type = "error", isHtml = false) {
      if (isHtml) {
        statusBanner.innerHTML = message;
      } else {
        statusBanner.textContent = message;
      }
      statusBanner.className = `status-banner ${type}`;
      statusBanner.style.display = "block";
    }

    function clearStatus() {
      statusBanner.style.display = "none";
      statusBanner.className = "status-banner";
      statusBanner.innerHTML = "";
    }

    // If user already logged in, redirect straight to dashboard
    const existingUser = getCachedUser();
    if (existingUser && existingUser.email) {
      showStatus(`Welcome back, ${existingUser.displayName || existingUser.email}! Redirecting...`, "success");
      setTimeout(() => {
        const dest = window.getDashboardUrl ? window.getDashboardUrl() : "/dashboard";
        window.location.href = dest;
      }, 600);
    } else {
      // Check if user is returning from a redirect sign-in
      if (sessionStorage.getItem("auth_redirect_pending") === "true") {
        showStatus("Completing sign-in...", "info");
      }
      checkRedirectAuth().then((user) => {
        if (user) {
          handleAuthSuccess(user);
        }
      }).catch((err) => {
        handleAuthError(err, "Redirect");
      });
    }

    // Toggle between Sign In and Sign Up
    function setAuthMode(login) {
      isLoginMode = login;
      clearStatus();
      if (isLoginMode) {
        titleText.textContent = "Sign in to Account";
        subtitleText.textContent = "Sign in to your Account.";
        nameInput.style.display = "none";
        nameInput.required = false;
        submitBtnText.textContent = "Continue with Email";
        googleBtnText.textContent = "Continue with Google";
        githubBtnText.textContent = "Continue with GitHub";
        if (appleBtnText) appleBtnText.textContent = "Continue with Apple";
        switchPrompt.textContent = "Don't have an account? ";
        toggleViewBtn.textContent = "Sign Up";
      } else {
        titleText.textContent = "Sign up for Account";
        subtitleText.textContent = "Create a new account to get started.";
        nameInput.style.display = "block";
        nameInput.required = true;
        submitBtnText.textContent = "Sign Up with Email";
        googleBtnText.textContent = "Sign up with Google";
        githubBtnText.textContent = "Sign up with GitHub";
        if (appleBtnText) appleBtnText.textContent = "Sign up with Apple";
        switchPrompt.textContent = "Already have an account? ";
        toggleViewBtn.textContent = "Sign In";
      }
    }

    toggleViewBtn.addEventListener("click", () => {
      setAuthMode(!isLoginMode);
    });

    // Check if Firebase is configured yet
    if (!isFirebaseConfigured()) {
      showStatus(
        "⚠️ Firebase credentials pending. See FIREBASE_AUTH_SETUP.md or click to test in demo mode.",
        "info"
      );
    }

    function handleAuthSuccess(user) {
      showStatus(`Welcome back, ${user.displayName || user.email}! Redirecting to Dashboard...`, "success");
      setTimeout(() => {
        const dest = window.getDashboardUrl ? window.getDashboardUrl() : "/dashboard";
        window.location.href = dest;
      }, 900);
    }

    function handleAuthError(err, providerName = "provider") {
      console.error(err);
      if (err.message === "CONFIG_NEEDED" || !isFirebaseConfigured()) {
        // Fallback demo for previewing before developer keys are inserted
        const userEmail = emailInput.value || `user@${providerName.toLowerCase()}.com`;
        const isAdmin = userEmail.toLowerCase() === "gobi56529@gmail.com";
        const simulatedUser = {
          uid: "demo_" + btoa(userEmail.toLowerCase()).replace(/[^a-zA-Z0-9]/g, "").slice(0, 18),
          displayName: isLoginMode ? (userEmail.split("@")[0] || "Demo User") : (nameInput.value || "New Creator"),
          email: userEmail,
          provider: providerName.toLowerCase(),
          role: isAdmin ? "admin" : "normal"
        };
        localStorage.setItem("nemo_user", JSON.stringify(simulatedUser));
        showStatus(`[Demo Mode] Signed in via ${providerName}! Redirecting to Dashboard...`, "success");
        setTimeout(() => {
          const dest = window.getDashboardUrl ? window.getDashboardUrl() : "/dashboard";
          window.location.href = dest;
        }, 1000);
        return;
      }

      let msg = err.message || "An authentication error occurred.";
      if (err.code === "auth/popup-blocked") {
        msg = "Pop-up was blocked by your browser. Redirecting you directly to sign in...";
        showStatus(msg, "info");
        return;
      } else if (err.code === "auth/unauthorized-domain") {
        const domain = window.location.hostname;
        const msg = `
          <div style="line-height: 1.5; font-size: 11px;">
            <strong>Domain Not Whitelisted:</strong> <code>${domain}</code> is not added in Firebase Console.
            <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
              <a href="https://console.firebase.google.com/project/nemo-8f9d8/authentication/settings" target="_blank" rel="noopener noreferrer" style="color: #67e8f9; text-decoration: underline; font-weight: 600;">1-Click Add in Firebase</a>
              <button type="button" id="btn-unauth-fallback" style="background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.5); color: #4ade80; padding: 4px 10px; border-radius: 4px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 10px;">Continue as Admin</button>
            </div>
          </div>
        `;
        showStatus(msg, "error", true);
        setTimeout(() => {
          const fallbackBtn = document.getElementById("btn-unauth-fallback");
          if (fallbackBtn) {
            fallbackBtn.onclick = () => {
              const simulatedUser = {
                uid: "admin_tunnel_" + Date.now(),
                displayName: "Gobi (Admin)",
                email: "gobi56529@gmail.com",
                role: "admin",
                provider: "google"
              };
              localStorage.setItem("nemo_user", JSON.stringify(simulatedUser));
              showStatus("Welcome Admin! Redirecting to Dashboard...", "success");
              setTimeout(() => {
                window.location.href = window.getDashboardUrl ? window.getDashboardUrl() : "/dashboard";
              }, 600);
            };
          }
        }, 50);
        return;
      } else if (err.code === "auth/popup-closed-by-user") {
        msg = "Sign-in popup closed before completion.";
      } else if (err.code === "auth/cancelled-popup-request") {
        msg = "Only one sign-in popup can be open at a time.";
      } else if (err.code === "auth/account-exists-with-different-credential") {
        msg = "An account already exists with this email. Try a different sign-in method.";
      } else if (err.code === "auth/wrong-password" || err.code === "auth/user-not-found" || err.code === "auth/invalid-credential") {
        msg = "Invalid email or password.";
      } else if (err.code === "auth/email-already-in-use") {
        msg = "Email is already registered. Please sign in instead.";
      } else if (err.code === "auth/too-many-requests") {
        msg = "Too many attempts. Please wait a moment and try again.";
      } else if (err.code === "auth/network-request-failed") {
        msg = "Network error. Please check your connection.";
      } else if (err.code === "auth/operation-not-allowed") {
        msg = `${providerName} sign-in is not enabled. Enable it in Firebase Console → Authentication → Sign-in method.`;
      }
      showStatus(msg, "error");
    }

    // Email Form Submit
    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearStatus();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const name = nameInput.value.trim();

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner spinner-dark"></span> Please wait...`;

      try {
        if (isLoginMode) {
          const user = await signInWithEmail(email, password);
          handleAuthSuccess(user);
        } else {
          const user = await signUpWithEmail(name, email, password);
          handleAuthSuccess(user);
        }
      } catch (err) {
        handleAuthError(err, "Email");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span id="submit-btn-text">${isLoginMode ? "Continue with Email" : "Sign Up with Email"}</span>`;
      }
    });

    // Google Sign-In
    btnGoogle.addEventListener("click", async () => {
      clearStatus();
      btnGoogle.disabled = true;
      const originalText = googleBtnText.textContent;
      googleBtnText.textContent = "Connecting to Google...";

      try {
        const user = await signInWithGoogle();
        if (user) {
          handleAuthSuccess(user);
        } else {
          // Automatic redirect triggered due to blocked popup
          showStatus("Pop-up blocked by browser. Redirecting to Google Sign-In...", "info");
          googleBtnText.textContent = "Redirecting to Google...";
          return;
        }
      } catch (err) {
        handleAuthError(err, "Google");
      } finally {
        btnGoogle.disabled = false;
        googleBtnText.textContent = originalText;
      }
    });

    // GitHub Sign-In
    btnGithub.addEventListener("click", async () => {
      clearStatus();
      btnGithub.disabled = true;
      const originalText = githubBtnText.textContent;
      githubBtnText.textContent = "Connecting to GitHub...";

      try {
        const user = await signInWithGithub();
        if (user) {
          handleAuthSuccess(user);
        } else {
          showStatus("Pop-up blocked by browser. Redirecting to GitHub...", "info");
          githubBtnText.textContent = "Redirecting to GitHub...";
          return;
        }
      } catch (err) {
        handleAuthError(err, "GitHub");
      } finally {
        btnGithub.disabled = false;
        githubBtnText.textContent = originalText;
      }
    });

    // Apple Sign-In
    btnApple.addEventListener("click", async () => {
      clearStatus();
      btnApple.disabled = true;
      const originalText = appleBtnText ? appleBtnText.textContent : "Continue with Apple";
      if (appleBtnText) appleBtnText.textContent = "Connecting to Apple...";

      try {
        const user = await signInWithApple();
        if (user) {
          handleAuthSuccess(user);
        } else {
          showStatus("Pop-up blocked by browser. Redirecting to Apple...", "info");
          if (appleBtnText) appleBtnText.textContent = "Redirecting to Apple...";
          return;
        }
      } catch (err) {
        handleAuthError(err, "Apple");
      } finally {
        btnApple.disabled = false;
        if (appleBtnText) appleBtnText.textContent = originalText;
      }
    });
  </script>

  <!-- NEMO Unified Cookie Consent & Privacy Preference Center -->
  <script src="js/cookie-consent.js" defer></script>
</body>
